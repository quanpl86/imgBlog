    <text font-family="Arial, sans-serif"><tspan x="860" y="240" font-size="22" fill="#1a1a1a">• Quyền chủ động của con người</tspan></text><text font-family="Arial, sans-serif"><tspan x="860" y="330" font-size="22" fill="#1a1a1a">• Cao</tspan></text><text font-family="Arial, sans-serif"><tspan x="860" y="420" font-size="22" fill="#1a1a1a">• Thấp</tspan></text>
  
