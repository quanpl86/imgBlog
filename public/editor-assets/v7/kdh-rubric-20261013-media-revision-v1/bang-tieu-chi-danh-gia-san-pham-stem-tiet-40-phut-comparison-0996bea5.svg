<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="100%" height="100%" fill="#fffaf5"/>
  
    <text font-family="Arial, sans-serif" font-weight="700"><tspan x="80" y="70" font-size="32" fill="#111111">Giáo viên nắm công thức phản hồi hai câu ngắn</tspan></text>
    <rect x="70" y="150" width="700" height="680" rx="16" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
    <rect x="830" y="150" width="700" height="680" rx="16" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
    <text font-family="Arial, sans-serif"><tspan x="100" y="240" font-size="22" fill="#1a1a1a">• Phản hồi dựa trên bằng chứng</tspan></text><text font-family="Arial, sans-serif"><tspan x="100" y="330" font-size="22" fill="#1a1a1a">• Điều đã làm được</tspan></text><text font-family="Arial, sans-serif"><tspan x="100" y="420" font-size="22" fill="#1a1a1a">• Bước cần cải tiến</tspan></text>
    <text font-family="Arial, sans-serif"><tspan x="860" y="240" font-size="22" fill="#1a1a1a">• Nhóm đã thử ba lần.</tspan></text><text font-family="Arial, sans-serif"><tspan x="860" y="330" font-size="22" fill="#1a1a1a">• Lần sau, hãy giải thích vì sao</tspan><tspan x="860" y="358" font-size="22" fill="#1a1a1a">cách sửa hiệu quả hơn.</tspan></text>
  
</svg>