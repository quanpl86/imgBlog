<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="100%" height="100%" fill="#fffaf5"/>
  
    <text font-family="Arial, sans-serif" font-weight="700"><tspan x="80" y="80" font-size="36" fill="#111111">Giáo viên có thể theo dõi mốc thời gian đánh giá</tspan><tspan x="80" y="122" font-size="36" fill="#111111">trong tiết 40 phút</tspan></text>
    
      <rect x="70" y="320" width="260" height="180" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
      <circle cx="98" cy="348" r="18" fill="#f97316"/>
      <text x="98" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">1</text>
      <text font-family="Arial, sans-serif" font-weight="600"><tspan x="90" y="398" font-size="18" fill="#1a1a1a">0–5 phút: Giới</tspan><tspan x="90" y="422" font-size="18" fill="#1a1a1a">thiệu tiêu chí</tspan></text>
      <polygon points="336,365 364,380 336,395" fill="#f97316"/>
    
      <rect x="370" y="320" width="260" height="180" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
      <circle cx="398" cy="348" r="18" fill="#f97316"/>
      <text x="398" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">2</text>
      <text font-family="Arial, sans-serif" font-weight="600"><tspan x="390" y="398" font-size="18" fill="#1a1a1a">5–25 phút: Quan</tspan><tspan x="390" y="422" font-size="18" fill="#1a1a1a">sát</tspan></text>
      <polygon points="636,365 664,380 636,395" fill="#f97316"/>
    
      <rect x="670" y="320" width="260" height="180" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
      <circle cx="698" cy="348" r="18" fill="#f97316"/>
      <text x="698" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">3</text>
      <text font-family="Arial, sans-serif" font-weight="600"><tspan x="690" y="398" font-size="18" fill="#1a1a1a">25–33 phút: Đối</tspan><tspan x="690" y="422" font-size="18" fill="#1a1a1a">chiếu</tspan></text>
      <polygon points="936,365 964,380 936,395" fill="#f97316"/>
    
      <rect x="970" y="320" width="260" height="180" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
      <circle cx="998" cy="348" r="18" fill="#f97316"/>
      <text x="998" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">4</text>
      <text font-family="Arial, sans-serif" font-weight="600"><tspan x="990" y="398" font-size="18" fill="#1a1a1a">33–38 phút: Phản</tspan><tspan x="990" y="422" font-size="18" fill="#1a1a1a">hồi</tspan></text>
      <polygon points="1236,365 1264,380 1236,395" fill="#f97316"/>
    
      <rect x="1270" y="320" width="260" height="180" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
      <circle cx="1298" cy="348" r="18" fill="#f97316"/>
      <text x="1298" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">5</text>
      <text font-family="Arial, sans-serif" font-weight="600"><tspan x="1290" y="398" font-size="18" fill="#1a1a1a">38–40 phút: Cải</tspan><tspan x="1290" y="422" font-size="18" fill="#1a1a1a">tiến</tspan></text>
      
    
  
</svg>